<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Goated Archive</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;600;700;800&display=swap');
    *{box-sizing:border-box}
    body{margin:0;background:#050505;color:#fff;font-family:Manrope,sans-serif}
    body:before{content:'';position:fixed;z-index:-1;inset:-20%;background:radial-gradient(circle at 15% 15%,#282828,transparent 25%),radial-gradient(circle at 90% 70%,#222,transparent 30%);filter:blur(35px)}
    .glass{background:linear-gradient(135deg,#ffffff20,#ffffff08);border:1px solid #ffffff28;box-shadow:0 25px 60px #0008;backdrop-filter:blur(20px)}
    #gate{min-height:100vh;display:grid;place-items:center;padding:20px}
    .gate{width:min(650px,100%);padding:clamp(30px,6vw,62px);border-radius:34px}
    .mono{font:11px 'DM Mono';color:#aaa;letter-spacing:.14em}
    .brand{font-size:clamp(48px,8vw,86px);line-height:.87;font-weight:800;letter-spacing:-.09em;margin:25px 0}
    .brand i{color:#999;font-style:normal}
    p{color:#bbb;line-height:1.6}
    input,textarea,select{width:100%;background:#0005;border:1px solid #555;color:#fff;border-radius:14px;padding:14px;font:600 14px Manrope}
    button{border:0;border-radius:14px;padding:14px 19px;background:#fff;color:#000;font-weight:800;cursor:pointer}
    button.alt{background:transparent;color:#fff;border:1px solid #555}
    .row{display:flex;gap:10px;margin-top:23px}
    .error{height:22px;color:#fbb;font-size:12px;margin-top:8px}
    .music{display:flex;gap:10px;align-items:center;margin-top:16px;color:#aaa;font-size:12px}
    .music button{padding:8px 12px}
    main{display:none;max-width:1220px;margin:auto;padding:20px 28px 60px}
    nav{display:flex;justify-content:space-between;align-items:center;padding:10px 0 35px}
    .logo{font-size:19px;font-weight:800;letter-spacing:-.05em}
    .hero{padding:clamp(30px,6vw,65px);border-radius:32px}
    .hero h1{font-size:clamp(40px,7vw,82px);line-height:.92;letter-spacing:-.08em;margin:16px 0}
    .tools{display:grid;grid-template-columns:1fr auto;gap:10px;margin:26px 0}
    .filters{display:flex;gap:8px}
    .filters select{width:auto}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .card{padding:20px;border-radius:22px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;justify-content:space-between}
    .card:hover{transform:translateY(-4px)}
    .card h3{margin:17px 0 8px;letter-spacing:-.04em}
    .card p{font-size:13px;margin:0;min-height:42px}
    .card footer{margin-top:20px;font:10px 'DM Mono';display:flex;justify-content:space-between;align-items:center;color:#bbb}
    .download-btn{background:transparent;border:1px solid #555;color:#fff;padding:6px 10px;border-radius:8px;font-size:11px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;font-weight:600}
    .download-btn:hover{background:#ffffff22;border-color:#888}
    .modal{display:none;position:fixed;inset:0;background:#000c;padding:18px;place-items:center}
    .modal.on{display:grid}
    .panel{width:min(1050px,100%);max-height:92vh;overflow:auto;padding:22px;border-radius:25px}
    .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
    .head-actions{display:flex;gap:10px;align-items:center}
    .head h2{margin:0}
    .panel iframe{width:100%;height:70vh;border:0;background:#fff;border-radius:14px}
    .admin{display:grid;grid-template-columns:340px 1fr;gap:14px}
    .box{padding:18px;border-radius:19px}
    .stack{display:grid;gap:9px}
    .item{display:flex;justify-content:space-between;gap:9px;border-bottom:1px solid #ffffff1c;padding:11px 0;font-size:13px}
    .item button{padding:7px 10px;font-size:11px}
    .muted{color:#aaa;font-size:12px}
    @media(max-width:720px){main{padding:16px}.grid,.tools,.admin{grid-template-columns:1fr}.filters select{width:50%}.row{flex-wrap:wrap}}
  </style>
</head>
<body>
  <section id="gate">
    <div class="gate glass">
      <div class="mono">biz de birileriyiz</div>
      <div class="brand">Goated<i>.</i><br>arşiv</div>
      <p>Hazırlık sınavlarına erişmek için öğrenci anahtarını gir.</p>
      <form id="login">
        <div class="row">
          <input id="password" type="password" placeholder="Erişim anahtarı" autocomplete="off">
          <button>Arşive gir →</button>
        </div>
        <div id="err" class="error"></div>
      </form>
      <div class="music">
        <button id="play" class="alt">♪</button>
        <span id="musicText">Giriş müziği çalıyor</span>
        <audio id="audio" loop></audio>
      </div>
    </div>
  </section>

  <main id="app">
    <nav>
      <div class="logo">Goated<span style="color:#999">.</span>arşiv</div>
      <div>
        <button id="adminBtn" class="alt">Yönetim</button>
        <button id="leave">Çıkış</button>
      </div>
    </nav>
    <section class="hero glass">
      <div class="mono">SINAV KOLEKSİYONU</div>
      <h1 id="title">Goated Archive</h1>
      <p id="subtitle"></p>
    </section>
    <section class="tools">
      <input id="search" placeholder="Sınav, ders veya konu ara…">
      <div class="filters">
        <select id="cat"><option value="">Tüm dersler</option></select>
        <select id="grade"><option value="">Tüm sınıflar</option></select>
      </div>
    </section>
    <section id="grid" class="grid"></section>
  </main>

  <div id="viewer" class="modal">
    <div class="panel glass">
      <div class="head">
        <h2 id="vtitle">Sınav</h2>
        <div class="head-actions">
          <a id="modalDownload" class="download-btn" href="#" target="_blank" download>📥 İndir</a>
          <button class="close">×</button>
        </div>
      </div>
      <iframe id="pdf"></iframe>
    </div>
  </div>

  <div id="admin" class="modal">
    <div class="panel glass">
      <div class="head">
        <h2>Yönetim masası</h2>
        <button class="close">×</button>
      </div>
      <div class="admin">
        <div class="box glass">
          <form id="examForm" class="stack">
            <b>PDF sınav ekle</b>
            <input name="title" placeholder="Sınav başlığı" required>
            <input name="category" placeholder="Ders" required>
            <input name="grade" placeholder="Sınıf" required>
            <textarea name="description" placeholder="Açıklama"></textarea>
            <input name="pdf" type="file" accept="application/pdf" required>
            <button>Yükle</button>
          </form>
          <hr>
          <form id="settings" class="stack">
            <b>Site ayarları</b>
            <input name="title" placeholder="Başlık">
            <input name="subtitle" placeholder="Alt başlık">
            <label class="muted"><input name="music_enabled" type="checkbox" style="width:auto"> Müziği aç</label>
            <button>Kaydet</button>
          </form>
          <form id="musicForm" class="stack" style="margin-top:10px">
            <input name="audio" type="file" accept="audio/*" required>
            <button>MP3 yükle</button>
          </form>
          <p id="msg" class="muted"></p>
        </div>
        <div class="box glass">
          <b>Sınavlar</b>
          <div id="adminList"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    let student='',admin='',settings={},exams=[];
    const $=s=>document.querySelector(s),url=PORTAL_CONFIG.functionUrl;
    
    async function api(action,data={},form){
      let h={apikey:PORTAL_CONFIG.publishableKey,'x-portal-token':admin||student};
      let r=await fetch(url,{method:'POST',headers:form?h:{...h,'content-type':'application/json'},body:form?(()=>{form.append('action',action);return form})():JSON.stringify({action,...data})});
      let d=await r.json();
      if(!r.ok)throw Error(d.error||'İşlem başarısız');
      return d;
    }

    async function boot(){
      settings=await api('settings');
      $('#title').textContent=settings.title;
      $('#subtitle').textContent=settings.subtitle;
      $('#settings').title.value=settings.title;
      $('#settings').subtitle.value=settings.subtitle;
      $('#settings').music_enabled.checked=settings.music_enabled;
    }

    async function load(){
      exams=await api('exams');
      let cs=[...new Set(exams.map(x=>x.category))],gs=[...new Set(exams.map(x=>x.grade))];
      $('#cat').innerHTML='<option value="">Tüm dersler</option>'+cs.map(x=>`<option>${x}</option>`);
      $('#grade').innerHTML='<option value="">Tüm sınıflar</option>'+gs.map(x=>`<option>${x}</option>`);
      render();
    }

    function render(){
      let q=$('#search').value.toLowerCase(),c=$('#cat').value,g=$('#grade').value,ls=exams.filter(x=>(x.title+x.description+x.category).toLowerCase().includes(q)&&(!c||x.category===c)&&(!g||x.grade===g));
      $('#grid').innerHTML=ls.map(x=>`
        <article class="card glass" data-id="${x.id}">
          <div>
            <div class="mono">${x.category} · ${x.grade}. SINIF</div>
            <h3>${x.title}</h3>
            <p>${x.description||'PDF sınavını açmak için görüntüle.'}</p>
          </div>
          <footer>
            <span>GÖRÜNTÜLE →</span>
            <button class="download-btn" onclick="event.stopPropagation(); downloadPdf('${x.id}', '${x.title.replace(/'/g, "")}')">📥 İndir</button>
          </footer>
        </article>
      `).join('')||'<p class="muted">Sınav bulunamadı.</p>';
      
      document.querySelectorAll('.card').forEach(e=>e.onclick=()=>openPdf(e.dataset.id));
    }

    async function openPdf(id){
      let x=exams.find(x=>x.id===id),d=await api('file-url',{id});
      $('#vtitle').textContent=x.title;
      $('#pdf').src=d.url;
      $('#modalDownload').onclick = (e) => {
        e.preventDefault();
        downloadPdf(id, x.title);
      };
      $('#viewer').classList.add('on');
    }

    async function downloadPdf(id, title) {
      try {
        let d = await api('file-url', {id});
        let a = document.createElement('a');
        a.href = d.url;
        a.download = (title || 'sinav') + '.pdf';
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch(err) {
        alert('İndirilemedi: ' + err.message);
      }
    }
    window.downloadPdf = downloadPdf;

    $('#login').onsubmit=async e=>{
      e.preventDefault();
      try{
        student=(await api('student-login',{password:$('#password').value})).token;
        $('#gate').style.display='none';
        $('#app').style.display='block';
        await boot();
        await load();
      }catch(x){
        $('#err').textContent=x.message;
      }
    };

    $('#leave').onclick=()=>location.reload();
    $('#search').oninput=render;
    $('#cat').onchange=render;
    $('#grade').onchange=render;
    document.querySelectorAll('.close').forEach(x=>x.onclick=()=>document.querySelectorAll('.modal').forEach(m=>m.classList.remove('on')));

    $('#adminBtn').onclick=async()=>{
      let p=prompt('Yönetici şifresi');
      if(!p)return;
      try{
        admin=(await api('admin-login',{password:p})).token;
        $('#admin').classList.add('on');
        adminList();
      }catch(x){
        alert(x.message);
      }
    };

    async function adminList(){
      let d=await api('exams');
      $('#adminList').innerHTML=d.map(x=>`<div class="item"><span>${x.title}<br><i class="muted">${x.published?'Yayında':'Gizli'}</i></span><span><button onclick="pub('${x.id}',${!x.published})">${x.published?'Gizle':'Yayınla'}</button><button onclick="del('${x.id}')">Sil</button></span></div>`).join('');
    }

    window.pub=async(id,published)=>{await api('publish',{id,published});adminList();load()};
    window.del=async id=>{if(confirm('Silinsin mi?')){await api('delete',{id});adminList();load()}};

    $('#examForm').onsubmit=async e=>{
      e.preventDefault();
      try{
        await api('upload-exam',{},new FormData(e.target));
        e.target.reset();
        $('#msg').textContent='PDF yüklendi.';
        adminList();
        load();
      }catch(x){
        $('#msg').textContent=x.message;
      }
    };

    $('#musicForm').onsubmit=async e=>{
      e.preventDefault();
      try{
        await api('upload-music',{},new FormData(e.target));
        e.target.reset();
        $('#msg').textContent='Müzik yüklendi.';
        boot();
      }catch(x){
        $('#msg').textContent=x.message;
      }
    };

    $('#settings').onsubmit=async e=>{
      e.preventDefault();
      let f=new FormData(e.target);
      await api('save-settings',{title:f.get('title'),subtitle:f.get('subtitle'),music_enabled:e.target.music_enabled.checked?'true':'false'});
      $('#msg').textContent='Ayarlar kaydedildi.';
      boot();
    };

    window.addEventListener('pageshow',e=>{if(e.persisted)location.reload()});
    boot().catch(()=>{});
  </script>

  <!-- YOUTUBE MÜZİK PLAYER -->
  <script>
    const youtubeTrack = '1Bt2Tf5mt-Q';
    let isPlaying = false;

    function startYoutubeMusic() {
      let frame = document.getElementById('youtubeMusic');
      if (!frame) {
        frame = document.createElement('iframe');
        frame.id = 'youtubeMusic';
        frame.width = '1';
        frame.height = '1';
        frame.style.cssText = 'position:fixed;left:-100px;bottom:-100px;border:0;opacity:0;pointer-events:none';
        frame.allow = 'autoplay; encrypted-media';
        document.body.appendChild(frame);
      }
      frame.src = `https://www.youtube-nocookie.com/embed/${youtubeTrack}?autoplay=1&loop=1&playlist=${youtubeTrack}&controls=0&playsinline=1&rel=0`;
      document.querySelector('#musicText').textContent = 'Müzik çalıyor';
      isPlaying = true;
    }

    function stopYoutubeMusic() {
      let frame = document.getElementById('youtubeMusic');
      if (frame) {
        frame.remove();
      }
      document.querySelector('#musicText').textContent = 'Müzik durduruldu';
      isPlaying = false;
    }

    document.addEventListener('click', function initMusic() {
      if (!isPlaying) startYoutubeMusic();
      document.removeEventListener('click', initMusic);
    }, { once: true });

    document.querySelector('#login').addEventListener('submit', () => {
      if (!isPlaying) startYoutubeMusic();
    });

    document.querySelector('#play').onclick = () => {
      if (isPlaying) {
        stopYoutubeMusic();
      } else {
        startYoutubeMusic();
      }
    };
  </script>
</body>
</html>
